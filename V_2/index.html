<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html,
        body{
            width: 100%;
            height: 100%;
        }

        #main{
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input{
            display: none;
        }

        #btn {
            padding: 12px 22px;
            background-color: rgb(8, 240, 205);
            color: white;
            border-radius: 5px;
        }

        #btn:hover {
            background-color:rgb(1, 107, 77) ;
        }

    </style>
</head>
<body>
    <div id="main">
        <input id="fileinp" type="file">
        <div id="btn">Upload file</div>
    </div>
    <script src="script1.js"></script>
</body>
</html>
